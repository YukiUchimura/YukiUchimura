services:
  api:
    build:
      context: .
      dockerfile: Dockerfile   # ← ルートへ移動した Dockerfile を参照
    ports:
      - "7860:7860"
    volumes:
      - ./models_hf:/workspace/models_hf
      - ./uploads:/workspace/uploads
      - ./outputs:/workspace/outputs
    env_file:
      - .env                   # ← ここからトークン等を取り込み
    environment:
      - HF_HOME=/workspace/models_hf
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:128
      # 互換性のため両方エクスポート（huggingface_hub はどちらでも可）
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - HF_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: ["gpu"]   # Docker Desktop で GPU を有効化しておく
