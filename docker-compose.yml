version: "3.8"
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: face_synthesis_api
    ports:
      - "7860:7860"
    environment:
      MODEL_CACHE_DIR: /workspace/models_hf
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN}
      NVIDIA_VISIBLE_DEVICES: all
      PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:128"
    volumes:
      - ./models_hf:/workspace/models_hf
      - ./uploads:/workspace/uploads
      - ./outputs:/workspace/outputs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
