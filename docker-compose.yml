version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: face_synthesis_api
    ports:
      - "7860:7860"
    environment:
      MODEL_CACHE_DIR: /workspace/models_hf
      # Hugging Face の Private モデル等で必要になる場合は .env に設定してください
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN}
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      # Windows のパスはスラッシュでも OK（Docker Desktop）
      - F:/face_synthesis/models_hf:/workspace/models_hf
      - F:/face_synthesis/uploads:/workspace/uploads
      - F:/face_synthesis/outputs:/workspace/outputs
    # Compose v3 で GPU を使うための指定（Docker Desktop 環境では driver/capabilities を使う）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
