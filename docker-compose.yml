services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: face-synthesis-api:latest
    container_name: face-synthesis-api
    ports:
      - "8000:8000"
    volumes:
      - ./:/workspace
      - ./outputs:/workspace/outputs
      - ./models:/workspace/models
      - ./cache:/workspace/.cache/huggingface
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN-}
      HF_HOME: /workspace/.cache/huggingface
      TRANSFORMERS_CACHE: /workspace/.cache/huggingface
      DIFFUSERS_CACHE: /workspace/.cache/huggingface
      PYTORCH_CUDA_ALLOC_CONF: max_split_size_mb:128
    # Compose 1.28+ のGPU予約（Docker Desktopでも可）
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: 1
    profiles: ["gpu"]
    shm_size: "4gb"
