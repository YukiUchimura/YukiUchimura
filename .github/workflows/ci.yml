        # This is an integration test. For now, we are only running unit tests.
        # Implementing a true low-load generation test in CI would require:
        # - Securely handling Hugging Face token for model downloads (if private models).
        # - Caching downloaded models in CI to speed up runs.
        # - Sufficient runner resources (CPU/memory, potentially GPU if not mocked).
        # - Modifying tests or having specific integration test scripts.
