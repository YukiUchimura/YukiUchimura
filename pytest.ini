# pytest.ini
[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# Add other configurations like markers, logging options, etc.
filterwarnings =
    ignore::DeprecationWarning # Ignore general deprecation warnings if noisy
    ignore:.*Pydantic V1 style `@validator`:DeprecationWarning # Example for specific warning
    ignore::UserWarning:torchvision.io.image # Example for specific warning from a library
